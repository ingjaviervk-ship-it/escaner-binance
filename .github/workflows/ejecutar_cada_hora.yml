name: Bot Cuantitativo Cripto Telegram

on:
  schedule:
    # 3 alertas diarias automáticas: 00:05 UTC (cierre oficial diario), 08:00 UTC y 16:00 UTC
    - cron: '5 0,8,16 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras con un clic

# PERMISO PARA GUARDAR TU SALDO Y TRADES AUTOMÁTICAMENTE EN GITHUB
permissions:
  contents: write

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          pip install requests pandas numpy

      - name: Ejecutar Escáner Cuantitativo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_INICIAL: 4000.0   # Tu capital inicial de $4,000 USD
          RIESGO_MAX_PCT: 0.02      # Regla del 2% por trade
        run: |
          python escaner.py

      # AUTOGUARDADO DEL SALDO Y POSICIONES
      - name: Guardar saldo actualizado en GitHub
        run: |
          git config --global user.name "Bot Cuantitativo"
          git config --global user.email "bot@trading.local"
          git add estado_cuenta.json
          git diff --staged --quiet || (git commit -m "Actualizar saldo y trades [skip ci]" && git push)
